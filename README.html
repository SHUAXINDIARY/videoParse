<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>WebCodecs MP4 全帧解析 Demo</title>
        <style>
            :root {
                color-scheme: light;
                --page: #f4f1ea;
                --panel: #fffdf8;
                --ink: #22211e;
                --muted: #6d6a62;
                --line: #d9d3c7;
                --accent: #b84625;
                --accent-dark: #8f3219;
                --success: #286347;
                --danger: #a43f31;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-width: 320px;
                margin: 0;
                color: var(--ink);
                background: var(--page);
                font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }

            button,
            input {
                font: inherit;
            }

            button {
                min-height: 40px;
                padding: 0 16px;
                cursor: pointer;
                color: #fffdf8;
                border: 1px solid var(--accent);
                border-radius: 4px;
                background: var(--accent);
            }

            button:hover:not(:disabled) {
                background: var(--accent-dark);
            }

            button:focus-visible,
            input:focus-visible {
                outline: 3px solid color-mix(in srgb, var(--accent) 40%, transparent);
                outline-offset: 2px;
            }

            button:disabled {
                cursor: not-allowed;
                opacity: 0.5;
            }

            button.secondary {
                color: var(--ink);
                border-color: var(--line);
                background: transparent;
            }

            main {
                width: min(1440px, calc(100% - 32px));
                margin: 0 auto;
                padding: clamp(24px, 5vw, 72px) 0;
            }

            header {
                display: flex;
                gap: 24px;
                align-items: end;
                justify-content: space-between;
                padding-bottom: 24px;
                border-bottom: 1px solid var(--line);
            }

            h1,
            h2,
            p {
                margin: 0;
            }

            h1 {
                max-width: 820px;
                font-size: clamp(28px, 5vw, 52px);
                font-weight: 750;
                line-height: 1.05;
                letter-spacing: -0.055em;
            }

            h1 span {
                color: var(--accent);
            }

            h2 {
                font-size: 16px;
                letter-spacing: 0.02em;
            }

            .intro {
                max-width: 740px;
                margin-top: 12px;
                color: var(--muted);
                line-height: 1.6;
            }

            .runtime-badge {
                flex: none;
                padding: 8px 10px;
                font-size: 12px;
                font-weight: 700;
                color: var(--success);
                border: 1px solid currentColor;
                border-radius: 999px;
            }

            .runtime-badge.is-unsupported,
            .status[data-status="error"] {
                color: var(--danger);
            }

            .controls {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr) auto auto;
                gap: 12px;
                align-items: end;
                padding: 24px 0;
            }

            .field {
                display: grid;
                gap: 7px;
            }

            .field label {
                font-size: 12px;
                font-weight: 700;
                color: var(--muted);
            }

            input {
                width: 100%;
                min-height: 40px;
                padding: 8px 10px;
                color: var(--ink);
                border: 1px solid var(--line);
                border-radius: 4px;
                background: var(--panel);
            }

            input[type="file"] {
                padding: 7px;
            }

            .hint {
                grid-column: 1 / -1;
                color: var(--muted);
                font-size: 12px;
                line-height: 1.5;
            }

            .layout {
                display: grid;
                grid-template-columns: minmax(280px, 0.58fr) minmax(0, 1.42fr);
                gap: 18px;
                align-items: start;
            }

            .panel {
                overflow: hidden;
                border: 1px solid var(--line);
                background: var(--panel);
            }

            .panel-heading {
                display: flex;
                gap: 12px;
                align-items: center;
                justify-content: space-between;
                padding: 14px 16px;
                border-bottom: 1px solid var(--line);
            }

            .status {
                font-size: 12px;
                color: var(--muted);
            }

            .status[data-status="running"] {
                color: var(--accent);
            }

            .status[data-status="done"] {
                color: var(--success);
            }

            video {
                display: block;
                width: 100%;
                max-height: 360px;
                background: #211f1a;
            }

            .basic-video-info {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 1px;
                margin: 0;
                border-bottom: 1px solid var(--line);
                background: var(--line);
            }

            .basic-video-info__item {
                min-width: 0;
                padding: 12px 14px;
                background: var(--panel);
            }

            .basic-video-info dt {
                margin-bottom: 5px;
                color: var(--muted);
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.04em;
            }

            .basic-video-info dd {
                margin: 0;
                overflow: hidden;
                color: var(--ink);
                font-size: 13px;
                font-weight: 650;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            pre {
                min-height: 280px;
                max-height: 520px;
                margin: 0;
                padding: 16px;
                overflow: auto;
                color: #413d35;
                background: #f9f6ef;
                font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                white-space: pre-wrap;
                overflow-wrap: anywhere;
            }

            .frame-counter {
                color: var(--muted);
                font-size: 12px;
                font-variant-numeric: tabular-nums;
            }

            .frames {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
                padding: 16px;
            }

            .empty {
                grid-column: 1 / -1;
                padding: 32px 16px;
                color: var(--muted);
                text-align: center;
                border: 1px dashed var(--line);
            }

            figure {
                min-width: 0;
                margin: 0;
                border: 1px solid var(--line);
                background: #f9f6ef;
            }

            figure img {
                display: block;
                width: 100%;
                aspect-ratio: 16 / 9;
                object-fit: contain;
                background: #211f1a;
            }

            figcaption {
                padding: 7px 8px;
                overflow: hidden;
                color: var(--muted);
                font: 11px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            @media (max-width: 900px) {
                header,
                .layout {
                    display: grid;
                    grid-template-columns: 1fr;
                    align-items: start;
                }

                .controls {
                    grid-template-columns: 1fr 1fr;
                }
            }

            @media (max-width: 600px) {
                main {
                    width: min(100% - 20px, 1440px);
                }

                .controls {
                    grid-template-columns: 1fr;
                }

                .hint {
                    grid-column: auto;
                }

                .basic-video-info {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <header>
                <div>
                    <h1>MP4 <span>全帧</span>解析</h1>
                    <p class="intro">
                        Web Worker 中使用 mp4box 解封装，WebCodecs 解码，并将每一帧以 ImageBitmap 传回主线程展示。
                    </p>
                </div>
                <span id="runtimeBadge" class="runtime-badge" aria-live="polite">检查运行环境中…</span>
            </header>

            <section class="controls" aria-label="视频来源">
                <div class="field">
                    <label for="fileInput">上传 MP4 文件</label>
                    <input id="fileInput" type="file" accept="video/mp4,.mp4" />
                </div>
                <div class="field">
                    <label for="urlInput">或粘贴 MP4 URL</label>
                    <input id="urlInput" type="url" placeholder="https://example.com/video.mp4" />
                </div>
                <button id="startButton" type="button">解析全部帧</button>
                <button id="cancelButton" class="secondary" type="button" disabled>停止</button>
                <p class="hint">
                    选择本地视频或粘贴https/http协议的视频地址，仅支持 WebCodecs 的 Chromium 浏览器，以及可被 CORS 读取的 MP4 URL。长视频的全部帧会占用大量内存。
                </p>
            </section>

            <section class="layout">
                <div class="panel">
                    <div class="panel-heading">
                        <h2>视频与元数据</h2>
                        <span id="status" class="status" data-status="idle" aria-live="polite">等待输入</span>
                    </div>
                    <video id="preview" controls preload="metadata"></video>
                    <!-- 基本视频信息卡片：文件来源、容器与视频轨道关键参数 -->
                    <dl id="basicVideoInfo" class="basic-video-info" aria-label="视频基本信息">
                        <div class="basic-video-info__item">
                            <dt>文件名</dt>
                            <dd data-basic-video-info="fileName">—</dd>
                        </div>
                        <div class="basic-video-info__item">
                            <dt>视频格式</dt>
                            <dd data-basic-video-info="format">—</dd>
                        </div>
                        <div class="basic-video-info__item">
                            <dt>编码类型</dt>
                            <dd data-basic-video-info="codec">—</dd>
                        </div>
                        <div class="basic-video-info__item">
                            <dt>帧率</dt>
                            <dd data-basic-video-info="frameRate">—</dd>
                        </div>
                        <div class="basic-video-info__item">
                            <dt>分辨率</dt>
                            <dd data-basic-video-info="resolution">—</dd>
                        </div>
                        <div class="basic-video-info__item">
                            <dt>宽高尺寸</dt>
                            <dd data-basic-video-info="dimensions">—</dd>
                        </div>
                    </dl>
                    <pre id="metadata">{ "状态": "选择 MP4 文件或输入 URL 后开始解析" }</pre>
                </div>

                <div class="panel">
                    <div class="panel-heading">
                        <h2>已解码帧</h2>
                        <span id="frameCounter" class="frame-counter">0 帧</span>
                    </div>
                    <div id="frames" class="frames" aria-live="polite">
                        <p class="empty">解析后将在这里按时间戳展示每一帧。</p>
                    </div>
                </div>
            </section>
        </main>

        <script type="module">
            /**
             * 该地址固定为项目当前使用的 mp4box 版本。
             * Worker 通过 ESM import 加载，因此 HTML 必须由 localhost / HTTPS 提供服务。
             */
            const MP4BOX_MODULE_URL = "https://cdn.jsdelivr.net/npm/mp4box@2.3.0/dist/mp4box.all.js";
            /** 将 ImageBitmap 转换为 PNG 的 MIME 类型 */
            const FRAME_IMAGE_MIME_TYPE = "image/png";
            /** 毫秒转秒的换算值 */
            const MILLISECONDS_PER_SECOND = 1000;
            /** 不可用信息的统一占位符 */
            const UNKNOWN_VIDEO_INFO_TEXT = "未知";
            /** 帧率小数精度 */
            const FRAME_RATE_DECIMAL_DIGITS = 3;

            const fileInput = document.querySelector("#fileInput");
            const urlInput = document.querySelector("#urlInput");
            const startButton = document.querySelector("#startButton");
            const cancelButton = document.querySelector("#cancelButton");
            const preview = document.querySelector("#preview");
            const status = document.querySelector("#status");
            const metadata = document.querySelector("#metadata");
            const frames = document.querySelector("#frames");
            const frameCounter = document.querySelector("#frameCounter");
            const runtimeBadge = document.querySelector("#runtimeBadge");
            const basicVideoInfo = document.querySelector("#basicVideoInfo");

            let activeWorker = null;
            let activeWorkerUrl = null;
            let previewObjectUrl = null;
            let frameObjectUrls = [];
            let activeRunId = 0;
            let appendedFrameCount = 0;
            let frameQueue = Promise.resolve();

            /**
             * Worker 内完成 MP4 解封装与 WebCodecs 解码。
             * ImageBitmap 通过 Transferable 返回，避免像素数据复制。
             */
            const DECODER_WORKER_SOURCE = `
                import { createFile, DataStream, Endianness } from "${MP4BOX_MODULE_URL}";

                const BYTES_PER_MB = 1024 * 1024;
                const CHUNK_SIZE = 2 * BYTES_PER_MB;
                const EXTRACTION_BATCH_SIZE = 24;
                const MAX_DECODE_QUEUE_SIZE = 8;
                const MICROSECONDS_PER_SECOND = 1000000;
                const MICROSECONDS_PER_MILLISECOND = 1000;
                const BOX_HEADER_BYTES = 8;

                let mp4File = null;
                let videoDecoder = null;
                let sourceBlob = null;
                let targetTrackId = null;
                let pendingSamples = [];
                let inputFinished = false;
                let sourceFeedingComplete = false;
                let refeedFromOffset = -1;
                let extractedSampleCount = 0;
                let decodedFrameCount = 0;
                let doneSent = false;
                let flushing = false;
                let cancelled = false;
                let failed = false;

                const post = (type, payload, transferables = []) => {
                    self.postMessage({ type, payload }, transferables);
                };

                /** 将可能含二进制或循环引用的 mp4box 结果安全地展示为 JSON。 */
                const toDisplayValue = (value) => {
                    const seen = new WeakSet();
                    return JSON.parse(
                        JSON.stringify(value, (_key, item) => {
                            if (typeof item === "bigint") {
                                return item.toString() + "n";
                            }
                            if (item instanceof ArrayBuffer) {
                                return { type: "ArrayBuffer", byteLength: item.byteLength };
                            }
                            if (ArrayBuffer.isView(item)) {
                                return { type: item.constructor.name, byteLength: item.byteLength };
                            }
                            if (item && typeof item === "object") {
                                if (seen.has(item)) {
                                    return "[Circular]";
                                }
                                seen.add(item);
                            }
                            return item;
                        }),
                    );
                };

                const reportError = (error) => {
                    if (failed || cancelled) {
                        return;
                    }
                    failed = true;
                    const message = error instanceof Error ? error.message : String(error);
                    post("error", { message });
                };

                const toMicroseconds = (value, timescale) => {
                    if (!Number.isFinite(timescale) || timescale <= 0) {
                        return 0;
                    }
                    return Math.round((Number(value) * MICROSECONDS_PER_SECOND) / timescale);
                };

                /** 提取 AVC/HVC 等编码格式初始化 WebCodecs 所需的 description。 */
                const extractCodecDescription = (trackId) => {
                    const trackBox = mp4File?.getTrackById(trackId);
                    const sampleEntry = trackBox?.mdia?.minf?.stbl?.stsd?.entries?.[0];
                    if (!sampleEntry) {
                        return undefined;
                    }

                    for (const value of Object.values(sampleEntry)) {
                        if (!value || typeof value.write !== "function") {
                            continue;
                        }
                        const stream = new DataStream(undefined, 0, Endianness.BIG_ENDIAN);
                        value.write(stream);
                        if (stream.buffer.byteLength > BOX_HEADER_BYTES) {
                            return new Uint8Array(stream.buffer, BOX_HEADER_BYTES);
                        }
                    }
                    return undefined;
                };

                const sendProgress = (phase) => {
                    post("progress", {
                        phase,
                        decodedFrameCount,
                        pendingSampleCount: pendingSamples.length,
                    });
                };

                const maybeFinish = async () => {
                    if (
                        cancelled ||
                        failed ||
                        doneSent ||
                        flushing ||
                        !inputFinished ||
                        !sourceFeedingComplete ||
                        !videoDecoder ||
                        pendingSamples.length > 0 ||
                        videoDecoder.decodeQueueSize > 0
                    ) {
                        return;
                    }

                    flushing = true;
                    try {
                        await videoDecoder.flush();
                        if (!cancelled && !failed) {
                            doneSent = true;
                            post("done", { decodedFrameCount });
                        }
                    } catch (error) {
                        reportError(error);
                    } finally {
                        flushing = false;
                    }
                };

                const pumpDecodeQueue = () => {
                    if (
                        cancelled ||
                        failed ||
                        !videoDecoder ||
                        targetTrackId === null ||
                        videoDecoder.state !== "configured"
                    ) {
                        return;
                    }

                    while (pendingSamples.length > 0 && videoDecoder.decodeQueueSize < MAX_DECODE_QUEUE_SIZE) {
                        const sample = pendingSamples.shift();
                        if (!sample?.data) {
                            continue;
                        }
                        try {
                            videoDecoder.decode(
                                new EncodedVideoChunk({
                                    type: sample.is_sync ? "key" : "delta",
                                    timestamp: toMicroseconds(sample.cts, sample.timescale),
                                    duration: toMicroseconds(sample.duration, sample.timescale) || undefined,
                                    data: sample.data,
                                }),
                            );
                            mp4File?.releaseUsedSamples(targetTrackId, sample.number + 1);
                        } catch (error) {
                            reportError(error);
                            return;
                        }
                    }
                    sendProgress("正在解码");
                    void maybeFinish();
                };

                const configureDecoder = (track) => {
                    if (!("VideoDecoder" in self)) {
                        throw new Error("当前 Worker 环境不支持 WebCodecs VideoDecoder");
                    }

                    const description = extractCodecDescription(track.id);
                    const decoderConfig = {
                        codec: track.codec,
                        codedWidth: Math.round(track.video?.width ?? track.track_width ?? 0),
                        codedHeight: Math.round(track.video?.height ?? track.track_height ?? 0),
                        optimizeForLatency: true,
                        ...(description ? { description } : {}),
                    };

                    videoDecoder = new VideoDecoder({
                        output: async (frame) => {
                            let bitmap = null;
                            try {
                                if (cancelled || failed) {
                                    return;
                                }
                                bitmap = await createImageBitmap(frame);
                                const timestampUs = frame.timestamp ?? 0;
                                post(
                                    "frame",
                                    {
                                        index: decodedFrameCount,
                                        timestampMs: Math.round(timestampUs / MICROSECONDS_PER_MILLISECOND),
                                        bitmap,
                                    },
                                    [bitmap],
                                );
                                bitmap = null;
                                decodedFrameCount += 1;
                            } catch (error) {
                                reportError(error);
                            } finally {
                                bitmap?.close();
                                frame.close();
                                pumpDecodeQueue();
                                void maybeFinish();
                            }
                        },
                        error: reportError,
                    });
                    videoDecoder.configure(decoderConfig);

                    return {
                        ...decoderConfig,
                        description: description
                            ? { type: "Uint8Array", byteLength: description.byteLength }
                            : undefined,
                    };
                };

                /** 分片追加数据；每一块都必须标明其原始文件偏移。 */
                const feedBlob = async (startOffset) => {
                    let offset = startOffset;
                    while (offset < sourceBlob.size && !cancelled && !failed) {
                        const end = Math.min(offset + CHUNK_SIZE, sourceBlob.size);
                        const buffer = await sourceBlob.slice(offset, end).arrayBuffer();
                        buffer.fileStart = offset;
                        mp4File.appendBuffer(buffer);
                        offset = end;
                        post("input-progress", { loadedBytes: offset, totalBytes: sourceBlob.size });
                    }
                };

                /** 获取 mp4box 为重新读取媒体数据建议的起始偏移。 */
                const resolveRefeedOffset = () => {
                    const seekResult = mp4File?.seek(0, true);
                    const offset = Number(seekResult?.offset);
                    return Number.isFinite(offset) && offset > 0 ? offset : -1;
                };

                const start = async (file) => {
                    try {
                        sourceBlob = file;
                        mp4File = createFile();
                        mp4File.onError = (_module, message) => reportError(new Error(message));
                        mp4File.onReady = (info) => {
                            try {
                                const videoTrack = info.tracks.find((track) => Boolean(track.video));
                                if (!videoTrack) {
                                    throw new Error("MP4 中未找到视频轨道");
                                }

                                targetTrackId = videoTrack.id;
                                const decoderConfig = configureDecoder(videoTrack);
                                post("mp4-metadata", {
                                    mp4boxInfo: toDisplayValue(info),
                                    selectedVideoTrack: toDisplayValue(videoTrack),
                                    decoderConfig,
                                });

                                mp4File.setExtractionOptions(videoTrack.id, undefined, {
                                    nbSamples: EXTRACTION_BATCH_SIZE,
                                });
                                mp4File.start();

                                if (inputFinished) {
                                    refeedFromOffset = resolveRefeedOffset();
                                }
                                pumpDecodeQueue();
                            } catch (error) {
                                reportError(error);
                            }
                        };
                        mp4File.onSamples = (trackId, _user, samples) => {
                            if (trackId !== targetTrackId || cancelled || failed) {
                                return;
                            }
                            extractedSampleCount += samples.length;
                            pendingSamples.push(...samples);
                            pumpDecodeQueue();
                        };

                        post("progress", { phase: "读取 MP4 容器", decodedFrameCount: 0, pendingSampleCount: 0 });
                        await feedBlob(0);
                        inputFinished = true;
                        mp4File.flush();

                        /*
                         * moov 在文件尾部时，onReady 可能发生在首轮读取结束之前。
                         * 此时需在 flush 后确认没有样本，再按 mp4box 给出的偏移重新喂入 mdat 数据。
                         */
                        if (refeedFromOffset < 0 && extractedSampleCount === 0 && targetTrackId !== null) {
                            refeedFromOffset = resolveRefeedOffset();
                        }
                        if (refeedFromOffset >= 0 && !cancelled && !failed) {
                            post("progress", {
                                phase: "重新读取 MP4 媒体数据",
                                decodedFrameCount,
                                pendingSampleCount: pendingSamples.length,
                            });
                            await feedBlob(refeedFromOffset);
                            mp4File.flush();
                        }
                        sourceFeedingComplete = true;
                        if (extractedSampleCount === 0) {
                            throw new Error("MP4 未提取到可解码的视频样本");
                        }
                        pumpDecodeQueue();
                        await maybeFinish();
                    } catch (error) {
                        reportError(error);
                    }
                };

                self.onmessage = (event) => {
                    if (event.data.type === "start") {
                        void start(event.data.file);
                    }
                    if (event.data.type === "cancel") {
                        cancelled = true;
                        pendingSamples = [];
                        try {
                            mp4File?.stop();
                            videoDecoder?.close();
                        } catch (_error) {
                            // 任务终止时资源可能已关闭，无需额外处理。
                        }
                    }
                };
            `;

            /** 更新运行状态文本。 */
            const setStatus = (text, statusType = "idle") => {
                status.textContent = text;
                status.dataset.status = statusType;
            };

            /** 当前环境是否具备策略一的最低运行条件。 */
            const isWebCodecsSupported = () => {
                return window.isSecureContext && "Worker" in window && "VideoDecoder" in window;
            };

            /** 格式化以便显示的文件大小。 */
            const formatBytes = (bytes) => {
                if (!Number.isFinite(bytes)) {
                    return "未知";
                }
                const units = ["B", "KB", "MB", "GB"];
                const unitIndex = Math.min(Math.floor(Math.log(Math.max(bytes, 1)) / Math.log(1024)), units.length - 1);
                return `${(bytes / 1024 ** unitIndex).toFixed(unitIndex === 0 ? 0 : 2)} ${units[unitIndex]}`;
            };

            /** 将秒值安全格式化为可读字符串。 */
            const formatSeconds = (seconds) => {
                return Number.isFinite(seconds) ? `${seconds.toFixed(3)} 秒` : "未知";
            };

            /** 读取 HTMLVideoElement 可直接获得的元数据。 */
            const getBrowserMetadata = () => {
                const quality = typeof preview.getVideoPlaybackQuality === "function" ? preview.getVideoPlaybackQuality() : null;
                return {
                    duration: formatSeconds(preview.duration),
                    dimensions: `${preview.videoWidth} × ${preview.videoHeight}`,
                    currentSrc: preview.currentSrc || "未知",
                    networkState: preview.networkState,
                    readyState: preview.readyState,
                    playbackQuality: quality
                        ? {
                              totalVideoFrames: quality.totalVideoFrames,
                              droppedVideoFrames: quality.droppedVideoFrames,
                              corruptedVideoFrames: quality.corruptedVideoFrames,
                          }
                        : "浏览器未提供 getVideoPlaybackQuality",
                };
            };

            /** 将当前汇总元数据打印到页面。 */
            const renderMetadata = (data) => {
                metadata.textContent = JSON.stringify(data, null, 2);
                renderBasicVideoInfo(data);
            };

            /** 获取本地文件或 URL 对应的展示文件名。 */
            const getSourceFileName = (source) => {
                if (source?.name) {
                    return source.name;
                }
                if (!source?.url) {
                    return UNKNOWN_VIDEO_INFO_TEXT;
                }
                try {
                    const url = new URL(source.url);
                    const pathname = decodeURIComponent(url.pathname);
                    return pathname.split("/").pop() || url.hostname;
                } catch (_error) {
                    return source.url;
                }
            };

            /** 从文件名或 URL 中解析视频格式扩展名。 */
            const getSourceFormat = (source) => {
                const fileName = getSourceFileName(source);
                const extension = fileName.split(".").pop()?.toUpperCase();
                const mimeType = source?.mimeType || UNKNOWN_VIDEO_INFO_TEXT;
                if (!extension || extension === fileName.toUpperCase()) {
                    return mimeType;
                }
                return `${extension} · ${mimeType}`;
            };

            /** 根据 MP4 轨道样本数量与时长计算平均帧率。 */
            const getTrackFrameRate = (track) => {
                const duration = Number(track?.duration);
                const timescale = Number(track?.timescale);
                const frameCount = Number(track?.nb_samples);
                if (
                    !Number.isFinite(duration) ||
                    !Number.isFinite(timescale) ||
                    !Number.isFinite(frameCount) ||
                    duration <= 0 ||
                    timescale <= 0 ||
                    frameCount <= 0
                ) {
                    return UNKNOWN_VIDEO_INFO_TEXT;
                }
                const frameRate = (frameCount * timescale) / duration;
                return `${frameRate.toFixed(FRAME_RATE_DECIMAL_DIGITS)} fps（平均）`;
            };

            /** 渲染视频预览与 MP4 轨道解析后的基础信息卡片。 */
            const renderBasicVideoInfo = (data) => {
                const track = data?.mp4box?.selectedVideoTrack;
                const width = Number(track?.video?.width ?? track?.track_width ?? preview.videoWidth);
                const height = Number(track?.video?.height ?? track?.track_height ?? preview.videoHeight);
                const isVideoSizeAvailable =
                    Number.isFinite(width) && Number.isFinite(height) && width > 0 && height > 0;
                const resolution = isVideoSizeAvailable ? `${width} × ${height}` : UNKNOWN_VIDEO_INFO_TEXT;
                const basicInfo = {
                    fileName: getSourceFileName(data?.source),
                    format: getSourceFormat(data?.source),
                    codec: track?.codec || UNKNOWN_VIDEO_INFO_TEXT,
                    frameRate: getTrackFrameRate(track),
                    resolution,
                    dimensions: isVideoSizeAvailable ? `宽 ${width}px · 高 ${height}px` : UNKNOWN_VIDEO_INFO_TEXT,
                };
                Object.entries(basicInfo).forEach(([key, value]) => {
                    const field = basicVideoInfo.querySelector(`[data-basic-video-info="${key}"]`);
                    if (field) {
                        field.textContent = value;
                        field.title = value;
                    }
                });
            };

            /** 释放旧预览与帧缩略图的 Blob URL。 */
            const clearOutput = () => {
                frameObjectUrls.forEach((url) => URL.revokeObjectURL(url));
                frameObjectUrls = [];
                appendedFrameCount = 0;
                frameCounter.textContent = "0 帧";
                frameQueue = Promise.resolve();
                frames.replaceChildren();
                const empty = document.createElement("p");
                empty.className = "empty";
                empty.textContent = "正在等待 WebCodecs 输出第一帧…";
                frames.append(empty);
            };

            /** 终止正在运行的解码 Worker。 */
            const stopActiveWorker = () => {
                if (activeWorker) {
                    activeWorker.postMessage({ type: "cancel" });
                    activeWorker.terminate();
                    activeWorker = null;
                }
                if (activeWorkerUrl) {
                    URL.revokeObjectURL(activeWorkerUrl);
                    activeWorkerUrl = null;
                }
            };

            /** 统一更新按钮状态。 */
            const setBusy = (isBusy) => {
                startButton.disabled = isBusy;
                cancelButton.disabled = !isBusy;
            };

            /** 从文件或 URL 获取支持结构化克隆到 Worker 的 Blob。 */
            const loadSource = async () => {
                const file = fileInput.files?.[0];
                if (file) {
                    return {
                        blob: file,
                        source: {
                            type: "本地文件",
                            name: file.name,
                            mimeType: file.type || "未知",
                            size: formatBytes(file.size),
                        },
                    };
                }

                const rawUrl = urlInput.value.trim();
                if (!rawUrl) {
                    throw new Error("请上传 MP4 文件或输入可访问的视频 URL");
                }
                const parsedUrl = new URL(rawUrl);
                const response = await fetch(parsedUrl, { mode: "cors" });
                if (!response.ok) {
                    throw new Error(`视频请求失败：HTTP ${response.status}`);
                }
                const blob = await response.blob();
                if (blob.size === 0) {
                    throw new Error("视频 URL 返回了空文件");
                }
                return {
                    blob,
                    source: {
                        type: "远程 URL",
                        url: parsedUrl.href,
                            name: decodeURIComponent(parsedUrl.pathname).split("/").pop() || parsedUrl.hostname,
                        mimeType: response.headers.get("content-type") || blob.type || "未知",
                        size: formatBytes(blob.size),
                    },
                };
            };

            /** 为预览视频设置 Blob URL 并等待元数据加载。 */
            const loadPreviewMetadata = async (blob) => {
                if (previewObjectUrl) {
                    URL.revokeObjectURL(previewObjectUrl);
                }
                previewObjectUrl = URL.createObjectURL(blob);
                await new Promise((resolve, reject) => {
                    const handleLoaded = () => {
                        preview.removeEventListener("loadedmetadata", handleLoaded);
                        preview.removeEventListener("error", handleError);
                        resolve();
                    };
                    const handleError = () => {
                        preview.removeEventListener("loadedmetadata", handleLoaded);
                        preview.removeEventListener("error", handleError);
                        reject(new Error("浏览器无法读取该视频的媒体元数据"));
                    };
                    preview.addEventListener("loadedmetadata", handleLoaded, { once: true });
                    preview.addEventListener("error", handleError, { once: true });
                    preview.src = previewObjectUrl;
                    preview.load();
                });
            };

            /** 将一个可转移的 ImageBitmap 添加为 PNG 帧缩略图。 */
            const appendFrame = async ({ index, timestampMs, bitmap }) => {
                try {
                    const canvas = document.createElement("canvas");
                    canvas.width = bitmap.width;
                    canvas.height = bitmap.height;
                    const context = canvas.getContext("2d");
                    if (!context) {
                        throw new Error("无法创建 2D Canvas 上下文");
                    }
                    context.drawImage(bitmap, 0, 0);
                    const imageBlob = await new Promise((resolve) => canvas.toBlob(resolve, FRAME_IMAGE_MIME_TYPE));
                    if (!imageBlob) {
                        throw new Error("帧图像 PNG 编码失败");
                    }

                    const emptyState = frames.querySelector(".empty");
                    emptyState?.remove();
                    const imageUrl = URL.createObjectURL(imageBlob);
                    frameObjectUrls.push(imageUrl);

                    const figure = document.createElement("figure");
                    const image = document.createElement("img");
                    image.src = imageUrl;
                    image.alt = `第 ${index + 1} 帧，时间戳 ${timestampMs} 毫秒`;
                    image.loading = "lazy";
                    const caption = document.createElement("figcaption");
                    caption.textContent = `#${index + 1} · ${(timestampMs / MILLISECONDS_PER_SECOND).toFixed(3)}s`;
                    figure.append(image, caption);
                    frames.append(figure);

                    appendedFrameCount += 1;
                    frameCounter.textContent = `${appendedFrameCount} 帧`;
                } finally {
                    bitmap.close();
                }
            };

            /** 创建包含解码器逻辑的独立 Module Worker。 */
            const createDecoderWorker = () => {
                const workerBlob = new Blob([DECODER_WORKER_SOURCE], { type: "text/javascript" });
                activeWorkerUrl = URL.createObjectURL(workerBlob);
                return new Worker(activeWorkerUrl, { type: "module" });
            };

            /** 处理 Worker 返回的数据并维持帧展示顺序。 */
            const handleWorkerMessage = async (event, runId, result) => {
                if (runId !== activeRunId) {
                    event.data.payload?.bitmap?.close();
                    return;
                }
                const { type, payload } = event.data;
                if (type === "frame") {
                    frameQueue = frameQueue
                        .then(() => appendFrame(payload))
                        .catch((error) => {
                            if (runId !== activeRunId) {
                                return;
                            }
                            const message = error instanceof Error ? error.message : String(error);
                            setStatus(`帧渲染失败：${message}`, "error");
                            setBusy(false);
                            stopActiveWorker();
                        });
                    return;
                }
                if (type === "input-progress") {
                    setStatus(`读取容器：${formatBytes(payload.loadedBytes)} / ${formatBytes(payload.totalBytes)}`, "running");
                    return;
                }
                if (type === "progress") {
                    setStatus(`${payload.phase}：已输出 ${payload.decodedFrameCount} 帧`, "running");
                    return;
                }
                if (type === "mp4-metadata") {
                    result.mp4box = payload;
                    renderMetadata(result);
                    return;
                }
                if (type === "error") {
                    await frameQueue;
                    setStatus(`解析失败：${payload.message}`, "error");
                    setBusy(false);
                    stopActiveWorker();
                    return;
                }
                if (type === "done") {
                    await frameQueue;
                    setStatus(`解析完成：共 ${payload.decodedFrameCount} 帧`, "done");
                    setBusy(false);
                    stopActiveWorker();
                }
            };

            /** 启动一次全帧解码任务。 */
            const startDecoding = async () => {
                if (!isWebCodecsSupported()) {
                    setStatus("当前环境不支持 WebCodecs 策略一", "error");
                    return;
                }

                activeRunId += 1;
                const runId = activeRunId;
                stopActiveWorker();
                clearOutput();
                setBusy(true);
                setStatus("正在准备视频…", "running");

                try {
                    const { blob, source } = await loadSource();
                    await loadPreviewMetadata(blob);
                    const result = {
                        source,
                        browserMetadata: getBrowserMetadata(),
                        mp4box: "等待 Worker 完成 MP4 容器解析…",
                    };
                    renderMetadata(result);

                    activeWorker = createDecoderWorker();
                    activeWorker.onmessage = (event) => {
                        void handleWorkerMessage(event, runId, result);
                    };
                    activeWorker.onerror = (event) => {
                        if (runId !== activeRunId) {
                            return;
                        }
                        setStatus(`Worker 异常：${event.message || "无法加载解码 Worker"}`, "error");
                        setBusy(false);
                        stopActiveWorker();
                    };
                    activeWorker.postMessage({ type: "start", file: blob });
                } catch (error) {
                    const message = error instanceof Error ? error.message : String(error);
                    setStatus(`无法开始：${message}`, "error");
                    setBusy(false);
                }
            };

            startButton.addEventListener("click", () => {
                void startDecoding();
            });

            cancelButton.addEventListener("click", () => {
                activeRunId += 1;
                stopActiveWorker();
                setBusy(false);
                setStatus("已停止解析", "idle");
            });

            window.addEventListener("beforeunload", () => {
                stopActiveWorker();
                if (previewObjectUrl) {
                    URL.revokeObjectURL(previewObjectUrl);
                }
                frameObjectUrls.forEach((url) => URL.revokeObjectURL(url));
            });

            if (isWebCodecsSupported()) {
                runtimeBadge.textContent = "WebCodecs 可用";
            } else {
                runtimeBadge.textContent = "WebCodecs 不可用";
                runtimeBadge.classList.add("is-unsupported");
                setStatus("请使用 HTTPS / localhost 下的 Chromium 浏览器", "error");
                startButton.disabled = true;
            }
        </script>
    </body>
</html>
